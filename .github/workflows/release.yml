name: Release

# Builds native desktop bundles for macOS / Windows / Linux and attaches them to
# the GitHub Release for the pushed tag. The release version follows the tag
# (e.g. tag v0.1.0 -> app version 0.1.0). macOS is a UNIVERSAL build (Apple
# Silicon arm64 + Intel x86_64) so a single download runs on every Mac.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Fyne build deps (linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev

      - name: Install Fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      # macOS code signing / notarization is OPTIONAL and graceful: if the
      # Developer ID secrets below are set, the .app is signed with the hardened
      # runtime and the .dmg is notarized + stapled (no Gatekeeper warning). If
      # they are NOT set, the app is only AD-HOC signed — which still prevents the
      # "app is damaged" error on Apple Silicon, but users will see the "cannot
      # verify" prompt and must Open Anyway / strip the quarantine attribute.
      # Secrets to enable full notarization (repo Settings ▸ Secrets ▸ Actions):
      #   MACOS_CERTIFICATE      base64 of the Developer ID Application .p12
      #   MACOS_CERTIFICATE_PWD  password for that .p12
      #   MACOS_SIGN_IDENTITY    e.g. "Developer ID Application: Name (TEAMID)"
      #   APPLE_ID               Apple ID email used for notarytool
      #   APPLE_TEAM_ID          10-char Apple Team ID
      #   APPLE_APP_PASSWORD     app-specific password for that Apple ID
      - name: Package
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # fyne reads the app version from FyneApp.toml -> sync it to the tag.
          sed -i.bak 's/^  Version = .*/  Version = "'"$VERSION"'"/' FyneApp.toml && rm -f FyneApp.toml.bak
          FYNE="$(go env GOPATH)/bin/fyne"
          if [ "${{ matrix.target }}" = "darwin" ]; then
            # Build both arches and lipo into a universal binary, then swap it
            # into the .app that fyne packages.
            CGO_ENABLED=1 GOARCH=arm64 go build -o yon-arm64 .
            CGO_ENABLED=1 GOARCH=amd64 go build -o yon-amd64 .
            lipo -create -output yon-universal yon-arm64 yon-amd64
            "$FYNE" package -os darwin
            exe="$(ls Yon.app/Contents/MacOS/*)"
            cp yon-universal "$exe"
            lipo -archs "$exe"
            # Register the .yon document type so double-clicking a collection in
            # Finder opens it in Yon (same injection as packaging/macos/package.sh).
            sh packaging/macos/register-filetype.sh Yon.app
            # Code sign the finished .app. Developer ID (+ hardened runtime) when
            # the cert is configured; ad-hoc otherwise.
            if [ -n "${MACOS_CERTIFICATE:-}" ]; then
              echo "Signing with Developer ID + hardened runtime (notarizable)"
              KEYCHAIN="$RUNNER_TEMP/build.keychain"
              security create-keychain -p actions "$KEYCHAIN"
              security set-keychain-settings -lut 21600 "$KEYCHAIN"
              security unlock-keychain -p actions "$KEYCHAIN"
              security default-keychain -s "$KEYCHAIN"
              echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
              security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
              security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN" >/dev/null
              codesign --force --deep --options runtime --timestamp \
                --entitlements packaging/macos/entitlements.plist \
                --sign "$MACOS_SIGN_IDENTITY" Yon.app
              codesign --verify --strict --verbose=2 Yon.app
            else
              echo "No Developer ID secret — ad-hoc signing (fixes 'damaged' on Apple Silicon; NOT notarized)"
              codesign --force --deep --sign - Yon.app
            fi
          else
            "$FYNE" package -os ${{ matrix.target }}
          fi

      - name: Archive
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          case "${{ matrix.target }}" in
            darwin)
              # Ship a drag-to-install .dmg: it mounts showing Yon.app next to an
              # Applications shortcut, so the user just drags the app across.
              DMG="dist/Yon-${GITHUB_REF_NAME}-macos.dmg"
              brew install create-dmg
              create-dmg \
                --volname "Yon" \
                --window-size 600 380 \
                --icon-size 120 \
                --icon "Yon.app" 150 190 \
                --app-drop-link 450 190 \
                --hide-extension "Yon.app" \
                "$DMG" "Yon.app" || {
                  echo "create-dmg failed — building a plain drag-install .dmg"
                  rm -f "$DMG"
                  mkdir -p dmgstage
                  cp -R Yon.app dmgstage/
                  ln -s /Applications dmgstage/Applications
                  hdiutil create -volname "Yon" -srcfolder dmgstage -ov -format UDZO "$DMG"
                }
              # Notarize + staple the .dmg when Apple credentials are configured
              # (the app inside was Developer-ID signed above). Skipped otherwise.
              if [ -n "${MACOS_CERTIFICATE:-}" ]; then
                echo "Submitting $DMG to Apple notarization (this can take a few minutes)…"
                xcrun notarytool submit "$DMG" \
                  --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
                  --wait
                xcrun stapler staple "$DMG"
                xcrun stapler validate "$DMG"
              fi
              ;;
            windows) 7z a  "dist/Yon-${GITHUB_REF_NAME}-windows.zip" Yon.exe ;;
            linux)   mv Yon.tar.xz "dist/Yon-${GITHUB_REF_NAME}-linux.tar.xz" ;;
          esac

      # Upload this platform's asset to the pre-created DRAFT release with the gh
      # CLI (a native runner binary — avoids the deprecated Node-20 action) and a
      # retry loop, because the upload step occasionally hits a transient
      # api.github.com connect timeout. --clobber makes a retry idempotent. The
      # release stays a draft (upload never publishes it); the publish job below
      # flips it public only once all three platforms have uploaded, so an in-app
      # update check never sees a version with a missing per-OS download.
      - name: Upload asset to the draft release (with retry)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"; then
              echo "uploaded on attempt $attempt"
              exit 0
            fi
            echo "upload attempt $attempt failed; retrying in 15s..." >&2
            sleep 15
          done
          echo "upload failed after 3 attempts" >&2
          exit 1

  # Publish the release only after all platform builds succeeded and uploaded
  # their assets, so users never see a version they can't download yet.
  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Flip the release from draft to public
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"
